<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>식수인원 산출 도구 · FY2026 입소율</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1B2C;
    --surface: #17263B;
    --surface-2: #1E2F48;
    --border: rgba(237,234,224,0.12);
    --border-strong: rgba(237,234,224,0.22);
    --text: #EDEAE0;
    --text-dim: #9CA0AC;
    --text-mute: #6C7280;
    --gold: #D9A94F;
    --gold-dim: #7A6636;
    --teal: #6FA5A0;
    --teal-dim: #35504E;
    --red: #CB7A63;
    --red-dim: #5B392F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:56px 32px 80px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--gold);
    text-transform:uppercase;
    margin:0 0 10px;
  }
  h1{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:34px;
    margin:0 0 8px;
    line-height:1.3;
  }
  .sub{
    color:var(--text-dim);
    font-size:14px;
    margin:0 0 40px;
    line-height:1.7;
  }
  .search-row{
    position:relative;
    margin-bottom:28px;
  }
  #q{
    width:100%;
    padding:16px 20px;
    font-size:17px;
    font-family:'Noto Sans KR', sans-serif;
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:10px;
    color:var(--text);
    outline:none;
  }
  #q::placeholder{color:var(--text-mute);}
  #q:focus{border-color:var(--gold-dim);}

  .layout{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width:760px){
    .layout{grid-template-columns:1fr;}
    .wrap{padding:36px 18px 60px;}
    h1{font-size:26px;}
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:6px;
  }
  .list-empty{
    padding:28px 18px;
    color:var(--text-mute);
    font-size:13px;
    line-height:1.7;
  }
  .list-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:13px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
  }
  .list-item:hover{background:var(--surface-2);}
  .list-item.active{background:var(--surface-2); border:1px solid var(--gold-dim);}
  .list-item .nm{
    line-height:1.5;
  }
  .list-item .sc{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-mute);
    white-space:nowrap;
    padding-left:8px;
  }
  .list-item.active .sc{color:var(--gold);}

  .detail{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:32px;
    min-height:420px;
  }
  .detail-empty{
    display:flex;
    align-items:center;
    justify-content:center;
    height:380px;
    color:var(--text-mute);
    font-size:14px;
    text-align:center;
    line-height:1.8;
  }
  .course-title{
    font-family:'Noto Serif KR', serif;
    font-size:20px;
    font-weight:500;
    margin:0 0 4px;
    line-height:1.4;
  }
  .course-meta{
    color:var(--text-mute);
    font-size:12px;
    font-family:'IBM Plex Mono', monospace;
    margin:0 0 28px;
  }

  .gauge-row{
    display:flex;
    align-items:center;
    gap:32px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .gauge-num{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:56px;
    line-height:1;
  }
  .gauge-cap{
    color:var(--text-dim);
    font-size:13px;
    margin-top:8px;
  }

  .months{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:24px;
  }
  .month-chip{
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 12px;
    border:1px solid var(--border-strong);
    border-radius:20px;
    font-size:12px;
    font-family:'IBM Plex Mono', monospace;
    cursor:pointer;
    color:var(--text-mute);
    user-select:none;
  }
  .month-chip input{accent-color:var(--gold); margin:0;}
  .month-chip.on{
    color:var(--text);
    border-color:var(--gold-dim);
    background:rgba(217,169,79,0.08);
  }
  .month-chip.nodata{opacity:0.35; cursor:not-allowed;}

  .bars{
    display:flex;
    align-items:flex-end;
    gap:10px;
    height:120px;
    padding-top:10px;
    border-top:1px solid var(--border);
  }
  .bar-col{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    height:100%;
    gap:6px;
  }
  .bar{
    width:100%;
    max-width:34px;
    background:var(--teal-dim);
    border-radius:3px 3px 0 0;
    position:relative;
  }
  .bar.used{background:var(--gold-dim);}
  .bar-val{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
  }
  .bar-lbl{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-mute);
  }

  .note{
    margin-top:22px;
    padding-top:18px;
    border-top:1px solid var(--border);
    font-size:12px;
    color:var(--text-mute);
    line-height:1.8;
  }
  .note b{color:var(--gold); font-weight:500;}
  footer{
    margin-top:44px;
    font-size:11px;
    color:var(--text-mute);
    line-height:1.8;
  }
</style>
</head>

<div class="wrap">

  <h1>식수인원 산출 도구</h1>
  <p class="sub">과정명을 입력하면 정확한 명칭이 아니어도 비슷한 과정을 찾아 3개월 평균 입소율을 계산합니다. 데이터는 2026년 1~6월 실적 기준입니다.</p>

  <div class="search-row">
    <input id="q" type="text" placeholder="과정명을 입력하세요 (예: SM 역량강화, 지점장, 슈퍼루키...)" autocomplete="off">
  </div>

  <div class="layout">

    <div class="detail"><div id="detail" class="detail-empty">왼쪽 목록에서 과정을 선택하면<br>월별 입소율과 평균이 표시됩니다.</div></div>
  </div>

  <footer>데이터 출처: FY2026_연인원_현황.xls (S열, 입소예정 대비 입소율) · 1~6월 총 180개 과정 기록 · 7월 이후 자료는 파일을 다시 전달하면 갱신할 수 있습니다.</footer>
</div>

const MONTHS = ['1월','2월','3월','4월','5월','6월'];

function normalize(s){
  return s.replace(/\s+/g,'').replace(/[_\-\.\/()]/g,'').toLowerCase();
}

function levRatio(a,b){
  const la=a.length, lb=b.length;
  if(la===0 || lb===0) return 0;
  const dp = new Array(la+1);
  for(let i=0;i<=la;i++) dp[i]=new Array(lb+1).fill(0);
  for(let i=0;i<=la;i++) dp[i][0]=i;
  for(let j=0;j<=lb;j++) dp[0][j]=j;
  for(let i=1;i<=la;i++){
    for(let j=1;j<=lb;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
    }
  }
  return 1 - dp[la][lb]/Math.max(la,lb);
}

function bestWindowScore(query,name){
  if(name.length <= query.length) return levRatio(query,name);
  let best = 0;
  const step = Math.max(1, Math.floor(query.length/3));
  for(let start=0; start<=name.length-1; start+=step){
    for(const len of [query.length, query.length+2, Math.max(2,query.length-2)]){
      const window = name.slice(start, start+len);
      if(window.length===0) continue;
      const r = levRatio(query, window);
      if(r>best) best=r;
    }
  }
  return best;
}

function scoreMatch(query, name){
  const nq = normalize(query), nn = normalize(name);
  if(nq.length===0) return 0;
  if(nn.includes(nq)) return 1.0;
  return bestWindowScore(nq, nn);
}

function getUniqueCourses(){
  const map = new Map();
  for(const row of COURSE_DATA){
    if(!map.has(row.name)) map.set(row.name, []);
    map.get(row.name).push(row);
  }
  return map;
}
const COURSES = getUniqueCourses();

const listEl = document.getElementById('list');
const detailEl = document.getElementById('detail');
const qEl = document.getElementById('q');

let currentSelection = null;
let checkedMonths = new Set();

function defaultMonthsFor(rows){
  const byMonth = {};
  rows.forEach(r=>{ byMonth[r.month]=r; });
  const present = MONTHS.filter(m=>byMonth[m]);
  return present.slice(-3);
}

function renderList(query){
  if(!query || query.trim().length===0){
    listEl.className='list-empty';
    listEl.innerHTML='검색어를 입력하면 일치하는 과정이 여기에 표시됩니다.';
    return;
  }
  const results = [];
  for(const [name, rows] of COURSES.entries()){
    const s = scoreMatch(query, name);
    if(s >= 0.45) results.push({name, score:s, rows});
  }
  results.sort((a,b)=>b.score-a.score);
  const top = results.slice(0,25);
  if(top.length===0){
    listEl.className='list-empty';
    listEl.innerHTML='일치하는 과정을 찾지 못했습니다. 다른 키워드로 시도해보세요.';
    return;
  }
  listEl.className='';
  listEl.innerHTML = top.map(r=>{
    const active = currentSelection===r.name ? 'active' : '';
    const pct = Math.round(r.score*100);
    return `<div class="list-item ${active}" data-name="${escAttr(r.name)}">
      <span class="nm">${escHtml(r.name)}</span>
      <span class="sc">${pct}%</span>
    </div>`;
  }).join('');
  listEl.querySelectorAll('.list-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentSelection = el.getAttribute('data-name');
      const rows = COURSES.get(currentSelection) || [];
      checkedMonths = new Set(defaultMonthsFor(rows));
      renderList(qEl.value);
      renderDetail();
    });
  });
}

function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s){
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}

function renderDetail(){
  if(!currentSelection){
    detailEl.className='detail-empty';
    detailEl.innerHTML='왼쪽 목록에서 과정을 선택하면<br>월별 입소율과 평균이 표시됩니다.';
    return;
  }
  const rows = COURSES.get(currentSelection) || [];
  const byMonth = {};
  rows.forEach(r=>{ byMonth[r.month]=r; });

  const used = MONTHS.filter(m=>checkedMonths.has(m) && byMonth[m]);
  const avg = used.length ? used.reduce((sum,m)=>sum+byMonth[m].rate,0)/used.length : null;

  const chips = MONTHS.map(m=>{
    const has = !!byMonth[m];
    const on = checkedMonths.has(m) && has;
    const cls = ['month-chip'];
    if(on) cls.push('on');
    if(!has) cls.push('nodata');
    return `<label class="${cls.join(' ')}" data-month="${m}">
      <input type="checkbox" ${on?'checked':''} ${has?'':'disabled'}>
      ${m}${has?'':' (자료없음)'}
    </label>`;
  }).join('');

  const maxRate = Math.max(1, ...rows.map(r=>r.rate));
  const bars = MONTHS.map(m=>{
    const r = byMonth[m];
    if(!r) return `<div class="bar-col"><div class="bar" style="height:2px;background:var(--border)"></div><span class="bar-val">-</span><span class="bar-lbl">${m}</span></div>`;
    const h = Math.max(4, Math.round((r.rate/maxRate)*96));
    const isUsed = checkedMonths.has(m);
    return `<div class="bar-col">
      <span class="bar-val">${Math.round(r.rate*100)}%</span>
      <div class="bar ${isUsed?'used':''}" style="height:${h}px"></div>
      <span class="bar-lbl">${m}</span>
    </div>`;
  }).join('');

  const gaugeColor = avg===null ? 'var(--text-mute)' : (avg>=0.9?'var(--gold)':(avg>=0.75?'var(--teal)':'var(--red)'));

  const isShort = used.length>0 && used.length<3;
  const gaugeLabel = used.length===0 ? '자료 없음'
    : used.length===3 ? `직전 3개월(${used.join(', ')}) 평균 입소율`
    : `직전 ${used.length}개월(${used.join(', ')}) 평균 입소율*`;
  const gaugeDisplay = avg===null ? '-' : Math.round(avg*100)+'%'+(isShort?'*':'');

  detailEl.className='';
  detailEl.innerHTML = `
    <h2 class="course-title">${escHtml(currentSelection)}</h2>
    <p class="course-meta">전체 실시 기록 ${rows.length}개월 중 ${used.length}개월 반영</p>
    <div class="gauge-row">
      <div>
        <div class="gauge-num" style="color:${gaugeColor}">${gaugeDisplay}</div>
        <div class="gauge-cap">${gaugeLabel}</div>
      </div>
    </div>
    <div class="months">${chips}</div>
    <div class="bars">${bars}</div>
    <div class="note">
      기본값은 <b>이 과정이 실제로 실시된 달 중 가장 최근 3개월</b>입니다. 3개월 실적이 없으면 2개월, 2개월도 없으면 1개월치로 자동 축소되며 이때 <b>* 표시</b>로 알려드립니다(달력상 4·5·6월이 아니라, 그 과정이 실제로 열린 달 기준입니다).
      체크박스를 눌러 반영할 월을 직접 조정할 수도 있습니다.
      일치도가 낮은 과정이 섞여 있을 수 있으니, 반드시 목록에서 정확한 과정명인지 확인하세요.
    </div>
  `;

  detailEl.querySelectorAll('.month-chip').forEach(el=>{
    const m = el.getAttribute('data-month');
    if(!byMonth[m]) return;
    el.addEventListener('click', (e)=>{
      e.preventDefault();
      if(checkedMonths.has(m)) checkedMonths.delete(m); else checkedMonths.add(m);
      renderDetail();
    });
  });
}

qEl.addEventListener('input', ()=>{
  currentSelection = null;
  renderList(qEl.value);
  renderDetail();
});
</script>
